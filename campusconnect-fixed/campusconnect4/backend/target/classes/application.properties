# Server
server.port=8080

# Database — update password if different
spring.datasource.url=jdbc:mysql://localhost:3306/campusconnect?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=false

# Run data.sql AFTER JPA creates schema
spring.sql.init.mode=never
spring.jpa.defer-datasource-initialization=true

# JWT
jwt.secret=campusconnect-super-secret-key-must-be-at-least-256-bits-long-for-hs256
jwt.expiration=86400000

# Logging
logging.level.com.campusconnect=DEBUG
logging.level.org.springframework.security=WARN
